<div class="container">
  <h1>Hejka</h1>
  <p>jakis tekst</p>
  <button class="btn btn-primary"> Przycisk </button>
  <h4 class="niebieski">Witaj: {{imie}} {{nazwisko}}</h4>
  <p>2 do 3 to {{potega}}</p>

  <!-- string interpolejszyn-->
  <img src="{{obrazek}}" alt="obrazek" width="200">

  <!-- property interpolejszyn-->
  <img [src] = "obrazek2" width="200">

  <h1>Jestem {{osoba.imie}} {{osoba.nazwisko}}</h1>

  <p>Podaj imię:</p>
  <input type="text" [(ngModel)]="osoba.imie">
  <p>podaj nazwisko: </p>
  <input type="text" [(ngModel)]="osoba.nazwisko">
  <p>Podaj nazwe pliku:</p>
  <input type="text" [(ngModel)]="osoba.zdjecie">
  <img src = "{{osoba.zdjecie}}" width="20" alt="">

  <button class="btn btn-success" (click)="pokazujZdjecia()">Pokazywanie zdjecia</button>
  <p>{{pokazywaniezdjecia}}</p>

  <div *ngIf="pokazywaniezdjecia">
    <img src="{{ osoba.zdjecie}}" width="120" alt="">
  </div>


</div>
