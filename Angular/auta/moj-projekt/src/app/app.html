
<div id="baner"
     [style.background-color]="kolorb"
     [style.color]="kolort">

  Wybierz samochód marzeń:

  <select [(ngModel)]="samochod">
    <option [ngValue]="null">Brak wyboru</option>

    <option *ngFor="let value of samochody" [ngValue]="value">
      {{ value.marka }} {{ value.model }}
    </option>
  </select>

  <button
    type="button"
    (click)="zmienKolor()"
    [class.przycisk]="aktywna"
    [style.color]="kolort">
    Zmień kolor tła
  </button>
</div>

<div id="contener">
  <div id="panel_lewy">
    <label class="check">
      <input type="checkbox" [(ngModel)]="pokazZdjecie">
      Pokaż zdjęcie
    </label>
  </div>

  <div id="panel_srodkowy">
    <ng-container *ngIf="samochod; else brakWyboru">

      <p class="akapit">
        {{ samochod.marka }} {{ samochod.model }}
      </p>

      <img
        *ngIf="pokazZdjecie && samochod.zdjecie; else brakZdjecia"
        class="center"
        [src]="samochod.zdjecie"
        [alt]="samochod.marka + ' ' + samochod.model">

      <ng-template #brakZdjecia>
        <p class="center">Brak zdjęcia</p>
      </ng-template>

    </ng-container>

    <ng-template #brakWyboru>
      <p class="center">Nie wybrano samochodu</p>
    </ng-template>
  </div>

  <div id="panel_prawy">
    <ng-container [ngSwitch]="samochod?.type">
      <img src="sport.jpg" *ngSwitchCase="Rodzaj.sportowy">
      <img src="suv.jpg" *ngSwitchCase="Rodzaj.suv">
      <img src="cabrio.jpg" *ngSwitchCase="Rodzaj.cabrio">
    </ng-container>


    <p>Dane:</p>

    <ul *ngIf="samochod">
      <li *ngFor="let item of samochod.dane">
        {{ item }}
      </li>
    </ul>


  </div>

  
</div>
<footer style="text-align: center;">
    {{stopka.autor}} {{stopka.tekst}} {{stopka.rok}}
  </footer>
