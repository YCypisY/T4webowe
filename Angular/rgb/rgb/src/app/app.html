<div style="text-align: center;">

  <div style="display: inline-block; height: 400px; width: 400px; border-radius: 20px;"
  [style.background-color]="kolor()"
  >

  </div>
  <br/> 
  <label for="">R: {{r}}</label>
  <input type="range" min="0" max="255" [(ngModel)]="r" style="accent-color: red; width:450px">
  <br>
   <label for="">G: {{g}}</label>
  <input type="range" min="0" max="255" [(ngModel)]="g" style="accent-color: green; width:450px">
  <br>
   <label for="">B: {{b}}</label>
  <input type="range" min="0" [(ngModel)]="b" max="255" style="accent-color: blue; width:450px">

  <p>RGB: {{r}}, {{g}}, {{b}}</p>

  <svg class="canvas" (click)="onCanvasClick($event)" style="width: 100%;height: 500px;border: 1px solid #ccc;display: block;">
    @for (line of lines; track $index) {
      <line
        [attr.x1]="line.x1"
        [attr.y1]="line.y1"
        [attr.x2]="line.x2"
        [attr.y2]="line.y2"
        stroke="black"
        stroke-width="2"
      />
    }
  </svg>

</div>
